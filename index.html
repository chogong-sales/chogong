function fmt(n) { return n ? n.toLocaleString("ko-KR")+"원" : "-"; }
function fmtDisc(pn, pf) { return pn>0?Math.round((1-pf/pn)*100):0; }

function Badge({ label, color }) {
  return <span style={{ background:color+"18", color, border:`1px solid ${color}38`, borderRadius:4, fontSize:11, fontWeight:700, padding:"2px 7px", whiteSpace:"nowrap" }}>{label}</span>;
}

/* ============================================================
   PRODUCT DETAIL MODAL
   ============================================================ */
function ProductDetail({ p, onClose }) {
  if (!p) return null;
  const lc = LINE_COLORS[p.line]||"#555";
  const disc = fmtDisc(p.price_n, p.price_f);
  const nutriItems = [["조단백",p.protein,"%"],["조지방",p.fat,"%"],["나트륨",p.sodium,"%"],["인(P)",p.phosphorus,"%"],["칼슘",p.calcium,"%"],["조섬유",p.fiber,"%"]].filter(([,v])=>v>0);
  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:12 }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#fff",borderRadius:16,maxWidth:560,width:"100%",maxHeight:"90vh",overflowY:"auto",padding:22,position:"relative" }}>
        <button onClick={onClose} style={{ position:"absolute",top:14,right:14,background:"#f3f4f6",border:"none",borderRadius:"50%",width:32,height:32,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>×</button>
        <div style={{ display:"flex",gap:5,flexWrap:"wrap",marginBottom:10 }}>
          <Badge label={p.line} color={lc}/>
          <Badge label={p.type} color={TYPE_BADGE[p.type]||"#555"}/>
          <Badge label={p.target==="고양이"?"🐱고양이":p.target==="강아지"?"🐶강아지":"🐾겸용"} color={p.target==="고양이"?"#6B21A8":p.target==="강아지"?"#B45309":"#059669"}/>
          {p.isBundle && <Badge label="묶음/대용량" color="#D97706"/>}
        </div>
        <h2 style={{ fontSize:17,fontWeight:700,color:"#111",marginBottom:4 }}>{p.name}</h2>
        {/* 용량 + 제형 타입 */}

          <span>📦 용량: <b style={{color:"#374151"}}>{p.size}</b></span>
          {p.form && <span>💧 제형: <b style={{color:"#1A7A4E",background:"#F0FDF4",padding:"1px 7px",borderRadius:4}}>{p.form}</b></span>}
          {p.parent && <span>📎 단품: <b style={{color:"#6B7280"}}>{p.parent}</b></span>}
        </div>

/* ============================================================
   DISEASE TAB — 간식 / 영양제 분리 + 낮은 성분순 정렬
   ============================================================ */
function DiseaseTab({ onSelect }) {
  const [sel,setSel]=useState(null);

  function getRecs(d) {
    // Hard exclude: avoid keyword in ingredients
    const avoidKwCheck = p => {
      const txt = ((p.sub||"")+(p.func||"")+(p.main||"")).toLowerCase();
      return !d.avoid_kw.some(kw=>txt.includes(kw.toLowerCase()));
    };
    // Score: lower avoid nutrient = better; more help keywords = better
    const getScore = p => {
      const txt = ((p.sub||"")+(p.func||"")+(p.main||"")).toLowerCase();
      let avoidPenalty = 0;
      d.avoid_fields.forEach(({field})=>{
        const val = p[field]||0;
        if(val>0) avoidPenalty += val;
      });
      let helpBonus = d.help_kw.filter(kw=>txt.includes(kw.toLowerCase())).length;
      return { avoidPenalty, helpBonus };
    };

    // Only non-bundle products for recommendations
    const base = PRODUCTS.filter(p=>!p.isBundle&&avoidKwCheck(p));
    const snacks = base.filter(p=>["주식캔","간식캔","습식간식","동결건조","양갱","츄잉"].includes(p.type));
    const supps = base.filter(p=>p.type==="영양제");

    const rank = arr => arr
      .map(p=>({ p, ...getScore(p) }))
      .sort((a,b)=>{ if(a.avoidPenalty!==b.avoidPenalty)return a.avoidPenalty-b.avoidPenalty; return b.helpBonus-a.helpBonus; })
      .slice(0,8);

    return { snacks:rank(snacks), supps:rank(supps) };
  }

  function AvoidTag({p,d}) {
    const tags=d.avoid_fields.filter(({field})=>p[field]>0).map(({field,label})=>`${label} ${p[field]}%`);
    if(!tags.length)return null;
    return <span style={{fontSize:10,color:"#DC2626",background:"#FEF2F2",padding:"2px 6px",borderRadius:4}}>⬇️ {tags.join(" · ")}</span>;
  }
  function HelpTag({p,d}) {
    const txt=((p.sub||"")+(p.func||"")).toLowerCase();
    const found=d.help_kw.filter(kw=>txt.includes(kw.toLowerCase()));
    if(!found.length)return null;
    return <span style={{fontSize:10,color:"#059669",background:"#ECFDF5",padding:"2px 6px",borderRadius:4}}>✅ {found.join("·")} 함유</span>;
  }

  function RecList({items,d,onSelect,label}) {
    if(!items.length)return<div style={{fontSize:12,color:"#9ca3af",padding:"10px 0"}}>해당 카테고리 추천 제품 없음</div>;
    return(
      <div>
        <div style={{ fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,paddingBottom:4,borderBottom:"1px solid #e5e7eb" }}>{label}</div>
        <div style={{ display:"flex",flexDirection:"column",gap:7 }}>
          {items.map(({p})=>(
            <div key={p.id} onClick={()=>onSelect(p)} style={{ background:"#fff",border:"1px solid #e5e7eb",borderRadius:9,padding:"10px 13px",cursor:"pointer",display:"flex",gap:10,alignItems:"flex-start" }}
              onMouseEnter={e=>e.currentTarget.style.borderColor="#1A7A4E"} onMouseLeave={e=>e.currentTarget.style.borderColor="#e5e7eb"}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex",gap:4,flexWrap:"wrap",marginBottom:3 }}>
                  <Badge label={p.line} color={LINE_COLORS[p.line]||"#555"}/>
                  <Badge label={p.form||p.type} color={TYPE_BADGE[p.type]||"#555"}/>
                </div>
                <div style={{ fontSize:13,fontWeight:600,color:"#111",marginBottom:3 }}>{p.name}</div>
                <div style={{ fontSize:11,color:"#6b7280",marginBottom:4 }}>{p.size} · {fmt(p.price_f)}</div>
                <div style={{ display:"flex",gap:4,flexWrap:"wrap" }}>
                  <AvoidTag p={p} d={d}/>
                  <HelpTag p={p} d={d}/>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if(sel) {
    const d=DISEASES.find(x=>x.name===sel);
    const {snacks,supps}=getRecs(d);
    return(
      <div>
        <button onClick={()=>setSel(null)} style={{ background:"none",border:"1px solid #e5e7eb",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,marginBottom:14,color:"#374151" }}>← 질병 목록</button>
        <div style={{ background:"#FFFBEB",border:"1px solid #FCD34D",borderRadius:12,padding:"14px 18px",marginBottom:10 }}>
          <div style={{ fontSize:18,marginBottom:4 }}>{d.icon} <strong>{d.name}</strong></div>
          <div style={{ fontSize:13,color:"#374151",marginBottom:8 }}>{d.desc}</div>
          <div style={{ display:"flex",gap:12,flexWrap:"wrap",fontSize:12 }}>
            {d.avoid_fields.length>0&&<div>⬇️ <b style={{color:"#DC2626"}}>낮을수록 좋음:</b> {d.avoid_fields.map(f=>f.label).join(", ")}</div>}
            {d.avoid_kw.length>0&&<div>🚫 <b style={{color:"#DC2626"}}>피해야 할 성분:</b> {d.avoid_kw.join(", ")}</div>}
            {d.help_kw.length>0&&<div>✅ <b style={{color:"#059669"}}>도움되는 성분:</b> {d.help_kw.join(", ")}</div>}
          </div>

        <div style={{ background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:8,padding:"9px 13px",marginBottom:14,fontSize:12,color:"#991B1B" }}>
          ⚕️ 처방약·치료식을 복용 중이라면 반드시 담당 수의사에게 상담 후 급여하세요.
        </div>
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16 }}>
          <RecList items={snacks} d={d} onSelect={onSelect} label="🍖 간식·주식 라인 추천"/>
          <RecList items={supps} d={d} onSelect={onSelect} label="💊 영양제 라인 추천"/>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{ fontSize:13,color:"#6b7280",marginBottom:12,padding:"10px 14px",background:"#f9fafb",borderRadius:8 }}>
        💡 질병을 선택하면 <b>간식 라인</b>과 <b>영양제 라인</b>으로 나누어, 피해야 할 성분이 낮은 순서로 추천합니다.

          <div key={d.name} onClick={()=>setSel(d.name)} style={{ background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:"15px 13px",cursor:"pointer",textAlign:"center",transition:"all 0.15s" }}

        ))}
      </div>
    </div>
  );
}

function IngredientTab({ onSelect }) {
  const [selNut,setSelNut]=useState(NUTRIENTS[0].key);
  const nut=NUTRIENTS.find(n=>n.key===selNut);

  const grouped = useMemo(()=>{
    const base=PRODUCTS.filter(p=>!p.isBundle);
    return TYPE_GROUPS.map(g=>{
      let list=base.filter(p=>g.types.includes(p.type));
      if(nut.ratio) {
        list=list.filter(p=>p.calcium>0&&p.phosphorus>0).map(p=>({p,val:p.calcium/p.phosphorus})).sort((a,b)=>Math.abs(a.val-1.2)-Math.abs(b.val-1.2)).slice(0,6).map(({p,val})=>({p,val}));
      } else {
        list=list.filter(p=>p[nut.key]>0).sort((a,b)=>a[nut.key]-b[nut.key]).slice(0,6).map(p=>({p,val:p[nut.key]}));
      }
      return {label:g.label,items:list};
    }).filter(g=>g.items.length>0);
  },[selNut]);

  return(
    <div>
      <div style={{ display:"flex",gap:6,flexWrap:"wrap",marginBottom:14 }}>
        {NUTRIENTS.map(n=>(
          <button key={n.key} onClick={()=>setSelNut(n.key)} style={{ padding:"7px 14px",borderRadius:20,border:`2px solid ${selNut===n.key?"#1A7A4E":"#e5e7eb"}`,cursor:"pointer",fontSize:12,fontWeight:selNut===n.key?700:400,background:selNut===n.key?"#1A7A4E":"#fff",color:selNut===n.key?"#fff":"#374151",transition:"all 0.15s" }}>{n.label}</button>
        ))}
      </div>
      <div style={{ background:"#F0FDF4",border:"1px solid #86EFAC",borderRadius:8,padding:"9px 13px",marginBottom:14,fontSize:13,color:"#14532D" }}>
        📊 {nut.desc} {nut.ratio?"(1.2:1 기준 가까운 순)":"(낮은 순)"} — 타입별 상위 6개
      </div>
      {grouped.map(g=>(
        <div key={g.label} style={{ marginBottom:18 }}>
          <div style={{ fontSize:13,fontWeight:700,color:"#374151",marginBottom:8,paddingBottom:4,borderBottom:"2px solid #e5e7eb" }}>{g.label}</div>
          <div style={{ display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7 }}>
            {g.items.map(({p,val},idx)=>{
              const lc=LINE_COLORS[p.line]||"#555";
              const displayVal = nut.ratio?`Ca/P=${val.toFixed(2)}:1`:`${val}${nut.unit}`;
              return(
                <div key={p.id} onClick={()=>onSelect(p)} style={{ background:"#fff",border:"1px solid #e5e7eb",borderRadius:9,padding:"10px 12px",cursor:"pointer",display:"flex",gap:9,alignItems:"center" }}
                  onMouseEnter={e=>e.currentTarget.style.borderColor="#1A7A4E"} onMouseLeave={e=>e.currentTarget.style.borderColor="#e5e7eb"}>
                  <div style={{ background:idx===0?"#FEF9C3":idx===1?"#F3F4F6":"#fff",color:idx===0?"#92400E":"#6b7280",fontWeight:700,fontSize:13,width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"1px solid #e5e7eb" }}>{idx+1}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex",gap:4,marginBottom:3 }}>
                      <Badge label={p.line} color={lc}/>
                      <Badge label={p.form||p.type} color={TYPE_BADGE[p.type]||"#555"}/>
                    </div>
                    <div style={{ fontSize:12,fontWeight:600,color:"#111",lineHeight:1.3,marginBottom:2 }}>{p.name}</div>
                    <div style={{ display:"flex",gap:6,fontSize:11 }}>
                      <span style={{ color:"#1D4ED8",fontWeight:700 }}>{displayVal}</span>
                      <span style={{ color:"#6b7280" }}>{fmt(p.price_f)}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function FAQTab() {
  const [selQ, setSelQ] = useState(null); // null=목록, {q,a,group}=답변화면
  const [search, setSearch] = useState("");

  const filteredGroups = useMemo(() => {
    if (!search.trim()) return FAQ_DATA;
    const kw = search.trim().toLowerCase();
    return FAQ_DATA
      .map(g => ({ ...g, items: g.items.filter(it => it.q.toLowerCase().includes(kw) || it.a.toLowerCase().includes(kw)) }))
      .filter(g => g.items.length > 0);
  }, [search]);

  /* ── 답변 전체화면 ── */
  if (selQ) {
    return (
      <div style={{ position:"fixed", inset:0, background:"#f9fafb", zIndex:9999,
        display:"flex", flexDirection:"column" }}>

        {/* 상단 고정 헤더 */}
        <div style={{ background:"#1A7A4E", padding:"14px 16px",
          display:"flex", alignItems:"center", gap:10,
          flexShrink:0, boxShadow:"0 2px 8px rgba(0,0,0,0.15)" }}>
          <button onClick={() => setSelQ(null)}
            style={{ background:"rgba(255,255,255,0.25)", border:"none", borderRadius:8,
              padding:"9px 16px", color:"#fff", fontSize:15, cursor:"pointer",
              fontWeight:700, display:"flex", alignItems:"center", gap:4 }}>
            ‹ 목록
          </button>
          <div style={{ flex:1 }}>
            <div style={{ color:"rgba(255,255,255,0.7)", fontSize:11, marginBottom:1 }}>자주 묻는 질문</div>
            <div style={{ color:"#fff", fontSize:12, fontWeight:600,
              overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
              {selQ.group}
            </div>
          </div>
        </div>

        {/* 스크롤 가능한 본문 */}
        <div style={{ flex:1, overflowY:"auto", WebkitOverflowScrolling:"touch" }}>
          <div style={{ padding:"20px 16px", maxWidth:640, margin:"0 auto" }}>

            {/* 질문 */}
            <div style={{ background:"#F0FDF4", border:"1px solid #6EE7B7",
              borderRadius:14, padding:"18px 20px", marginBottom:16 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#059669",
                marginBottom:8, letterSpacing:0.5 }}>Q</div>
              <div style={{ fontSize:17, fontWeight:700, color:"#14532D",
                lineHeight:1.6 }}>{selQ.q}</div>
            </div>

            {/* 답변 */}
            <div style={{ background:"#fff", border:"1px solid #e5e7eb",
              borderRadius:14, padding:"20px" }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#6b7280",
                marginBottom:12, letterSpacing:0.5 }}>A</div>
              <div style={{ fontSize:15, color:"#374151",
                lineHeight:2.1, whiteSpace:"pre-wrap" }}>{selQ.a}</div>
            </div>

            {/* 하단 여백 (버튼 높이만큼) */}
            <div style={{ height:80 }} />
          </div>
        </div>

        {/* 하단 고정 뒤로가기 버튼 */}
        <div style={{ flexShrink:0, padding:"12px 16px",
          background:"#fff", borderTop:"1px solid #e5e7eb",
          paddingBottom:"max(12px, env(safe-area-inset-bottom))" }}>
          <button onClick={() => setSelQ(null)}
            style={{ width:"100%", padding:"15px", background:"#1A7A4E",
              color:"#fff", border:"none", borderRadius:14,
              fontSize:15, fontWeight:700, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
            ‹ 질문 목록으로 돌아가기
          </button>
        </div>
      </div>
    );
  }

  /* ── 질문 목록 ── */
  return (
    <div>
      {/* 검색 */}
      <input
        value={search}
        onChange={e => setSearch(e.target.value)}
        placeholder="🔍  질문 검색..."
        style={{ width:"100%", padding:"13px 16px", fontSize:14,
          border:"1.5px solid #e5e7eb", borderRadius:12, outline:"none",
          boxSizing:"border-box", marginBottom:18, background:"#fff" }}
        onFocus={e => e.target.style.border="1.5px solid #1A7A4E"}
        onBlur={e => e.target.style.border="1.5px solid #e5e7eb"}
      />

      {/* 그룹별 질문 목록 */}
      {filteredGroups.map((g, gi) => (
        <div key={g.group} style={{ marginBottom:24 }}>
          {/* 그룹 레이블 */}
          <div style={{ fontSize:13, fontWeight:700, color:"#fff",
            background:"#1A7A4E", borderRadius:8, padding:"6px 12px",
            marginBottom:10, display:"inline-block" }}>
            {g.group}
          </div>

          {/* 질문 항목들 */}
          {g.items.map(it => (
            <div
              key={it.q}
              onClick={() => setSelQ({ q: it.q, a: it.a, group: g.group })}
              style={{ fontSize:14, padding:"15px 16px", borderRadius:12,
                cursor:"pointer", marginBottom:8, lineHeight:1.5,
                background:"#fff", border:"1px solid #e5e7eb",
                color:"#374151", display:"flex",
                justifyContent:"space-between", alignItems:"center", gap:8,
                transition:"background 0.1s" }}
              onMouseEnter={e => {
                e.currentTarget.style.background="#F0FDF4";
                e.currentTarget.style.borderColor="#6EE7B7";
              }}
              onMouseLeave={e => {
                e.currentTarget.style.background="#fff";
                e.currentTarget.style.borderColor="#e5e7eb";
              }}
              onTouchStart={e => {
                e.currentTarget.style.background="#F0FDF4";
                e.currentTarget.style.borderColor="#6EE7B7";
              }}
              onTouchEnd={e => {
                e.currentTarget.style.background="#fff";
                e.currentTarget.style.borderColor="#e5e7eb";
              }}
            >
              <span style={{ flex:1 }}>{it.q}</span>
              <span style={{ color:"#1A7A4E", fontSize:22,
                flexShrink:0, fontWeight:300, lineHeight:1 }}>›</span>
            </div>
          ))}
        </div>
      ))}

      {filteredGroups.length === 0 && (
        <div style={{ textAlign:"center", color:"#9ca3af", padding:"60px 0" }}>
          <div style={{ fontSize:40, marginBottom:12 }}>🔍</div>
          <div style={{ fontSize:15, fontWeight:600, marginBottom:4 }}>검색 결과가 없습니다</div>
          <div style={{ fontSize:13 }}>다른 키워드로 검색해보세요</div>
        </div>
      )}
    </div>
  );
}
